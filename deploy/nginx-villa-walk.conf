# villa.sunsetsamui.com -> villa-walk container on 127.0.0.1:3100
# Install: copy to /etc/nginx/sites-available/villa-walk, symlink into sites-enabled, nginx -t && nginx -s reload.
map $http_upgrade $villa_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name villa.sunsetsamui.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-villa;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name villa.sunsetsamui.com;

    ssl_certificate /etc/letsencrypt/live/villa.sunsetsamui.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/villa.sunsetsamui.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /ws {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $villa_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
